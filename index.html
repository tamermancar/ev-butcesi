<!DOCTYPE html>
<html lang="tr" data-gorunum="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ev Bütçesi</title>
<meta name="theme-color" content="#1D5870">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ev Bütçesi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- Renkler ---------- */
:root{
  --zemin:#E9EEEC; --yuzey:#FFFFFF; --yuzey2:#F3F6F5; --murekkep:#15252B; --soluk:#5F6F75; --cizgi:#D7DFDC;
  --sari:#8A5D05; --sari-acik:#F6EACB;
  --yesil:#1E8449; --yesil-acik:#DCF1E3; --kirmizi:#C62828; --kirmizi-acik:#FBE1E1; --gri:#4A5258; --gri-acik:#E3E7E9;
  --vurgu:#1D5870; --vurgu-acik:#D8E7ED; --ust1:#1D5870; --ust2:#174A5E;
  --yazi:15px; --pad:11px; --min:58px; --tik:32px;
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
/* ---------- Görünüm yoğunluğu ---------- */
:root[data-gorunum=siki]{--yazi:14px;--pad:6px;--min:46px;--tik:26px}
:root[data-gorunum=buyuk]{--pad:13px;--min:64px;--tik:34px}
/* Sıkı görünüm pencerelerde de: boşluklar daralır, kutu içi yazı 16px kalır (telefon otomatik yakınlaştırmasın) */
:root[data-gorunum=siki] .cekmece{padding-top:4px}
:root[data-gorunum=siki] .cekmece-ust{height:22px}
:root[data-gorunum=siki] .cekmece h3{font-size:17px}
:root[data-gorunum=siki] .cekmece .aciklama{margin-bottom:10px}
:root[data-gorunum=siki] .alan{margin-bottom:8px}
:root[data-gorunum=siki] .alan > span{font-size:12px;margin-bottom:2px}
:root[data-gorunum=siki] .alan input,:root[data-gorunum=siki] .alan select,:root[data-gorunum=siki] .giris-kutu{height:40px}
:root[data-gorunum=siki] .btn{min-height:42px;line-height:42px;font-size:15px;margin-top:6px}
:root[data-gorunum=siki] .btn.metin{min-height:38px;line-height:38px}
:root[data-gorunum=siki] .seg{margin-bottom:10px}
:root[data-gorunum=siki] .seg button{min-height:32px;font-size:13px}
:root[data-gorunum=siki] .cipler{gap:5px;margin-bottom:10px}
:root[data-gorunum=siki] .cip{padding:6px 11px;font-size:13px}
:root[data-gorunum=siki] .tutar-giris{margin:2px 0 10px}
:root[data-gorunum=siki] .tutar-giris input{font-size:28px}
:root[data-gorunum=siki] .secim{min-height:36px;font-size:14px;margin-bottom:4px}
:root[data-gorunum=siki] .ipucu{font-size:12px;margin-bottom:10px}
:root[data-gorunum=siki] .ayar-kart{padding:11px;margin-top:8px}
:root[data-gorunum=siki] .bilgi-satirlari > div{padding:8px 0}
:root[data-gorunum=buyuk] #ust,:root[data-gorunum=buyuk] #icerik,:root[data-gorunum=buyuk] .alt,
:root[data-gorunum=buyuk] .cekmece-ic,:root[data-gorunum=buyuk] .fab{zoom:1.12}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--zemin);color:var(--murekkep)}
body{font-size:var(--yazi);line-height:1.45;font-variant-numeric:tabular-nums;touch-action:manipulation;display:flex;flex-direction:column;position:relative}
.kaydir{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:0 14px 96px}

/* ---------- Üst bölüm ---------- */
.ust{background:linear-gradient(160deg,var(--ust1),var(--ust2));color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 5px}
.ust-ic{max-width:560px;margin:0 auto}
.nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:44px}
.nav .ok{width:44px;height:44px;font-size:26px;line-height:1;border-radius:22px;color:inherit}
.nav .ok:active{background:rgba(255,255,255,.15)}
.nav .ok:disabled{opacity:.3}
.nav .ad{justify-self:center;font-weight:700;font-size:17px;padding:6px 12px;border-radius:10px;text-align:center}
.nav .ad small{font-weight:500;opacity:.75;margin-left:5px}
.ust-alt{font-size:12px;opacity:.85;text-align:center;margin:0;padding-bottom:14px}
.kalan{padding:6px 2px 4px}
.kalan small{display:block;font-size:13px;opacity:.8}
.devir{display:block;font-size:12px;opacity:.85;margin-top:3px}
.kalan strong{display:block;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.ikili{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:10px 0 14px}
.ikili div{background:rgba(255,255,255,.12);border-radius:12px;padding:9px 11px;min-width:0}
.ikili small{display:block;font-size:12px;opacity:.85}
.ikili b{display:block;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.ikili em{display:block;font-style:normal;font-size:12px;opacity:.85}
.ilerleme-bas{display:flex;justify-content:space-between;font-size:12px;opacity:.85;margin-bottom:5px}
.ilerleme{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-bottom:0}
.ilerleme i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s}
.ust-not{font-size:12px;opacity:.85;margin:-6px 0 14px}
.senk{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:30;display:grid;place-items:center;width:30px;height:30px;padding:0;background:none;color:rgba(255,255,255,.72)}
.senk svg{width:20px;height:20px}
.senk.uyari{color:#F59E0B}
.senk.tamam{color:#4ADE80}
.senk.yazi{width:auto;height:auto;font-size:11px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;border-radius:10px;padding:3px 9px}

/* ---------- Liste ---------- */
.bolum{margin-top:18px}
.bolum h2{font-size:14px;font-weight:700;color:var(--soluk);margin:0 4px 6px;display:flex;justify-content:space-between;gap:8px}
.liste{background:var(--yuzey);border-radius:14px;overflow:hidden;border:1px solid var(--cizgi)}
.satir{display:flex;align-items:center;gap:12px;padding:var(--pad) 12px;min-height:var(--min);border-top:1px solid var(--cizgi);position:relative}
.satir:first-child{border-top:0}
.satir.d-gecikti::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--kirmizi)}
.tik{flex:none;width:var(--tik);height:var(--tik);border-radius:50%;border:2px solid var(--gri);display:grid;place-items:center;transition:background .15s,border-color .15s}
.tik svg{width:55%;height:55%;opacity:0;transition:opacity .15s}
.satir.d-gecikti .tik{border-color:var(--kirmizi)}
.satir.d-odendi .tik{background:var(--yesil);border-color:var(--yesil)}
.satir.d-odendi .tik svg{opacity:1}
.tik.kartik{border-style:dashed;font-size:13px}
.bilgi{flex:1;min-width:0;text-align:left}
.bilgi .ad{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir.atla .bilgi .ad{text-decoration:line-through;color:var(--soluk)}
.not-satir{font-size:12.5px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.acilis{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,var(--ust1),var(--ust2));color:#fff;transition:opacity .3s}
.acilis img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.acilis b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.acilis small{opacity:.75;font-size:11px;font-weight:700;letter-spacing:.12em}
.acilis.kapan{opacity:0;pointer-events:none}
.rozetler{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;font-size:12px;color:var(--soluk)}
.rozet{background:var(--yuzey2);border-radius:6px;padding:1px 7px}
.rozet.zam{background:var(--sari-acik);color:var(--sari);font-weight:600}
.durum{border-radius:6px;padding:1px 7px;font-weight:700}
.durum.odendi{background:var(--yesil-acik);color:var(--yesil)}
.durum.gecikti{background:var(--kirmizi-acik);color:var(--kirmizi)}
.durum.bekliyor{background:var(--gri-acik);color:var(--gri)}
.durum.notr{background:var(--yuzey2);color:var(--soluk)}
:root[data-gorunum=siki] .rozetler{margin-top:1px}
.sag{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.son{font-size:11px;color:var(--soluk);white-space:nowrap}
.satir.d-gecikti .son{color:var(--kirmizi);font-weight:600}
.tutar{font-weight:700;text-align:right;white-space:nowrap;padding:5px 9px;color:var(--gri);border:1px solid var(--cizgi);background:var(--yuzey2);border-radius:9px}
.tutar:active{border-color:var(--vurgu)}
.satir.d-odendi .tutar{color:var(--yesil)}
.satir.d-gecikti .tutar{color:var(--kirmizi)}
.satir.d-notr .tutar{color:var(--soluk)}
.tutar.bos{color:var(--murekkep);font-weight:600;font-size:13px;border-style:dashed;border-color:var(--soluk);background:none}
.bos-mesaj{padding:16px;color:var(--soluk);font-size:14px;text-align:center}
.tahmini{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--sari-acik);color:var(--sari);font-size:13px}
.karsilama{margin-top:18px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:18px}
.karsilama h3{margin:0 0 6px;font-size:18px}
.karsilama p{margin:0 0 6px;color:var(--soluk);font-size:14px}

/* ---------- Alt menü ve ekle ---------- */
.alt{flex:none;background:var(--yuzey);border-top:1px solid var(--cizgi);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.alt button{flex:1;max-width:140px;height:60px;font-size:12px;font-weight:600;color:var(--soluk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.alt button svg{width:22px;height:22px}
.alt button.aktif{color:var(--murekkep)}
.alt button.aktif::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--vurgu)}
.fab{position:absolute;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--vurgu);color:#fff;font-size:30px;font-weight:500;box-shadow:0 6px 18px rgba(21,37,43,.3);z-index:6}
.fab:active{transform:scale(.95)}

/* ---------- Çekmece ---------- */
.perde{position:fixed;inset:0;background:rgba(10,20,24,.45);z-index:10}
.cekmece{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--yuzey);border-radius:20px 20px 0 0;z-index:11;padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .22s ease-out}
.cekmece.acik{transform:none}
.cekmece-ic{max-width:520px;margin:0 auto}
.cekmece-ust{position:relative;height:28px;margin-bottom:4px}
.tutamak{width:40px;height:4px;border-radius:2px;background:var(--cizgi);margin:4px auto 0}
.kapat-btn{position:absolute;right:-8px;top:-4px;width:40px;height:40px;border-radius:20px;font-size:18px;color:var(--soluk)}
.kapat-btn:active{background:var(--yuzey2)}
.cekmece h3{margin:0;font-size:19px}
.cekmece .aciklama{margin:2px 0 14px;color:var(--soluk);font-size:13px}
.tutar-giris{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--vurgu);margin:6px 0 16px;padding-bottom:4px}
.tutar-giris input{flex:1;min-width:0;border:0;background:none;font-size:34px;font-weight:800;outline:none;padding:0}
.tutar-giris span{font-size:22px;font-weight:700;color:var(--soluk)}
.alan{display:block;margin-bottom:12px;min-width:0}
.alan > span{display:block;font-size:13px;font-weight:600;color:var(--soluk);margin-bottom:4px}
.alan input,.alan select{width:100%;height:46px;border:1px solid var(--cizgi);border-radius:10px;background:var(--yuzey2);padding:0 12px;font-size:16px}
.alan input:disabled{opacity:.45}
.yan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.secim{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;margin-bottom:8px}
.secim input{width:22px;height:22px;accent-color:var(--vurgu);flex:none}
.cipler{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.cip{border:1px solid var(--cizgi);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;background:var(--yuzey2)}
.cip.on{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--yuzey2);border:1px solid var(--cizgi);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{min-height:38px;border-radius:9px;font-weight:700;color:var(--soluk);font-size:14px;padding:4px 2px}
.seg button.on{background:var(--yuzey);color:var(--murekkep);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ay-cipler{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:-4px 0 14px}
.ay-cipler .cip{padding:8px 0;text-align:center;border-radius:10px}
.ipucu{font-size:13px;color:var(--soluk);margin:0 0 14px}
.btn{display:block;width:100%;min-height:50px;border-radius:12px;font-weight:700;font-size:16px;margin-top:8px;text-align:center;text-decoration:none;line-height:50px}
.btn.ana{background:var(--vurgu);color:#fff}
.btn.ikinci{background:var(--yuzey2);border:1px solid var(--cizgi);color:var(--murekkep)}
.btn.metin{min-height:44px;line-height:44px;color:var(--soluk);font-weight:600}
.btn.tehlike{color:var(--kirmizi)}

/* ---------- Sabitler ---------- */
.kalem{display:flex;align-items:center;border-top:1px solid var(--cizgi);min-height:var(--min)}
.kalem:first-child{border-top:0}
.kalem .bilgi{padding:var(--pad) 12px}
.kalem .alt-yazi{font-size:13px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.siralama{display:flex;flex-direction:column;border-left:1px solid var(--cizgi);align-self:stretch;justify-content:center}
.siralama button{width:46px;height:30px;color:var(--soluk);font-size:12px}
.siralama button:active{background:var(--yuzey2)}

/* ---------- Grafikler ---------- */
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:14px}
.grafik{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;align-items:end;height:170px;margin-top:4px}
.ay-sutun{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.cift{display:flex;align-items:flex-end;gap:2px;height:140px}
.cift i{display:block;width:8px;border-radius:3px 3px 0 0;min-height:2px}
.cift i.g{background:var(--yesil)}
.cift i.x{background:var(--kirmizi)}
.ay-sutun.gelecek .cift i{opacity:.3}
.ay-sutun span{font-size:11px;color:var(--soluk);margin-top:5px}
.ay-sutun.secili span{color:var(--murekkep);font-weight:800}
.lejant{display:flex;gap:14px;font-size:12px;color:var(--soluk);margin-top:10px;flex-wrap:wrap}
.lejant b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tablo-kutu{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--cizgi);border-radius:14px;background:var(--yuzey)}
.ytablo{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
.ytablo th,.ytablo td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--cizgi)}
.ytablo thead th{position:sticky;top:0;background:var(--yuzey2);font-weight:700;color:var(--soluk);z-index:1}
.ytablo thead th.bu{color:var(--murekkep);box-shadow:inset 0 -3px 0 var(--vurgu)}
.ytablo .ad{position:sticky;left:0;z-index:2;text-align:left;background:var(--yuzey);max-width:132px;min-width:110px;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--murekkep);box-shadow:1px 0 0 var(--cizgi)}
.ytablo thead .ad{z-index:3;background:var(--yuzey2)}
.ytablo tr.bas td{background:var(--vurgu);color:#fff;font-weight:800;text-align:left;font-size:12px;letter-spacing:.02em}
.ytablo tr.bas td.ad{background:var(--vurgu);color:#fff}
.ytablo tr.ara td{background:var(--yuzey2);color:var(--soluk);font-weight:700;text-align:left}
.ytablo tr.ara td.ad{background:var(--yuzey2);color:var(--soluk)}
.ytablo tr.top td{font-weight:800;background:var(--yuzey2)}
.ytablo tr.top td.ad{background:var(--yuzey2)}
.ytablo tr.kalan td{font-weight:800;background:var(--vurgu-acik)}
.ytablo tr.kalan td.ad{background:var(--vurgu-acik)}
.ytablo td.odendi{color:var(--yesil)}
.ytablo td.gecikti{color:var(--kirmizi);background:var(--kirmizi-acik);font-weight:700}
.ytablo td.bekliyor{color:var(--gri)}
.ytablo td.tahmin{color:var(--soluk);font-style:italic;opacity:.75}
.ytablo td.atla,.ytablo td.notr{color:var(--soluk)}
.ytablo td.yil{font-weight:800;color:var(--murekkep);background:var(--yuzey2)}
.ytablo td[data-act]{cursor:pointer}
.dag{padding:9px 0;border-top:1px solid var(--cizgi)}
.dag:first-child{border-top:0}
.dag .ust-satir{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.dag .cubuk{height:6px;background:var(--yuzey2);border-radius:3px;margin-top:5px;overflow:hidden}
.dag .cubuk i{display:block;height:100%;background:var(--vurgu);border-radius:3px}

/* ---------- Ayarlar ---------- */
.ayar-kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:14px;margin-top:10px}
.ayar-kart h3{margin:0 0 4px;font-size:15px}
.ayar-kart p.ipucu{margin-bottom:12px}
.ayar-kart .seg{margin-bottom:4px}
.tema-satir{display:flex;align-items:center;gap:10px}
.tema-satir > span{flex:none;width:44px;font-size:12px;font-weight:700;color:var(--soluk)}
.tema-satir > div{flex:1;min-width:0}
.tema-ayrac{height:1px;background:var(--cizgi);margin:12px 0}
.renkler{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.renk{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:2px solid transparent;font-size:13px;font-weight:600}
.renk i{width:38px;height:38px;border-radius:50%;display:block}
.renk.on{border-color:var(--vurgu);background:var(--yuzey2)}
.kat-cip{display:inline-flex;align-items:center;gap:4px;padding:6px 6px 6px 12px}
.kat-cip button{width:24px;height:24px;border-radius:12px;color:var(--soluk);font-size:13px}
.kat-ekle{display:flex;gap:8px}
.kat-ekle input{flex:1;min-width:0;height:44px;border:1px solid var(--cizgi);border-radius:10px;background:var(--yuzey2);padding:0 12px;font-size:16px}
.kat-ekle button{padding:0 16px;border-radius:10px;background:var(--vurgu);color:#fff;font-weight:700}
.yedek{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--cizgi)}
.yedek:first-child{border-top:0}
.yedek div{flex:1;min-width:0}
.yedek b{display:block;font-size:14px}
.yedek small{color:var(--soluk);font-size:12px}
.yedek button{padding:8px 12px;border-radius:9px;border:1px solid var(--cizgi);background:var(--yuzey2);font-weight:700;font-size:13px;flex:none}

.kilit-cip.acik{background:rgba(255,255,255,.3)}
.bilgi-satirlari > div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--cizgi)}

.yukleniyor{padding:60px 0;text-align:center;color:var(--soluk)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    Ayarlar</button>

<!-- Hesaplama kodu: telefonda ve Apps Script'te aynı dosya çalışır -->
<script src="ortak.js?v=3.6"></script>

<script>
/* ---------- Sabitler ---------- */
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const KISA = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GELIR_KAT = ['Ek gelir','Satış','Hediye','Diğer'];
const VARS_AYAR = { renk: 'petrol', mod: 'otomatik', gorunum: 'normal', kurus: 'hayir', birim: 'evet' };
const GORUNUMLER = [['siki','Sıkı'],['normal','Normal'],['buyuk','Büyük']];
/* Renk temaları: ana renk + ona uyumlu zemin, kart, çizgi ve yazı tonları (açık ve koyu). Ödendi/ödenmedi renkleri sabit kalır. */
const PALET = {
  petrol:   { ad: 'Petrol',   acik: { vurgu:'#1D5870', ust1:'#1F6380', ust2:'#174A5E', 'vurgu-acik':'#D8E7ED', zemin:'#E7EFF1', yuzey:'#FFFFFF', yuzey2:'#F1F6F7', cizgi:'#D2DFE3', soluk:'#5A6F77', murekkep:'#12262E' },
                              koyu: { vurgu:'#2C6F8A', ust1:'#1E5168', ust2:'#143847', 'vurgu-acik':'#1B3640', zemin:'#0E171A', yuzey:'#162226', yuzey2:'#1C2A2F', cizgi:'#28383D', soluk:'#93A6AC', murekkep:'#E2ECEE' } },
  orman:    { ad: 'Orman',    acik: { vurgu:'#2C6B4B', ust1:'#317A55', ust2:'#24573D', 'vurgu-acik':'#DCEDE2', zemin:'#E8F0EA', yuzey:'#FFFFFF', yuzey2:'#F2F7F3', cizgi:'#D3E1D7', soluk:'#5B7165', murekkep:'#13271C' },
                              koyu: { vurgu:'#2F7A55', ust1:'#255F43', ust2:'#1A4430', 'vurgu-acik':'#1B3527', zemin:'#0E1712', yuzey:'#15221B', yuzey2:'#1B2A21', cizgi:'#27392E', soluk:'#93A99B', murekkep:'#E2EFE6' } },
  lacivert: { ad: 'Lacivert', acik: { vurgu:'#2C3E7B', ust1:'#34498F', ust2:'#24336A', 'vurgu-acik':'#DEE3F3', zemin:'#E9ECF5', yuzey:'#FFFFFF', yuzey2:'#F3F5FB', cizgi:'#D6DCEC', soluk:'#5E6782', murekkep:'#151B33' },
                              koyu: { vurgu:'#3D55A6', ust1:'#2D4180', ust2:'#1F2D5C', 'vurgu-acik':'#1E2645', zemin:'#0F121D', yuzey:'#161B2B', yuzey2:'#1C2235', cizgi:'#29304A', soluk:'#99A1BB', murekkep:'#E4E8F5' } },
  erik:     { ad: 'Erik',     acik: { vurgu:'#6D3462', ust1:'#7E3C71', ust2:'#5A2A51', 'vurgu-acik':'#F0DFEC', zemin:'#F2EAF0', yuzey:'#FFFFFF', yuzey2:'#F9F3F7', cizgi:'#E6D6E2', soluk:'#775F70', murekkep:'#2A1527' },
                              koyu: { vurgu:'#8B4580', ust1:'#6E3665', ust2:'#50274A', 'vurgu-acik':'#3A2135', zemin:'#170F16', yuzey:'#22161F', yuzey2:'#2A1C27', cizgi:'#3B2936', soluk:'#AF97A9', murekkep:'#F2E6EF' } }
};
const DURUM_RENK = {
  acik: { yesil:'#1E8449', 'yesil-acik':'#DCF1E3', kirmizi:'#C62828', 'kirmizi-acik':'#FBE1E1', gri:'#4A5258', 'gri-acik':'#E3E7E9', sari:'#8A5D05', 'sari-acik':'#F6EACB' },
  koyu: { yesil:'#5ACB86', 'yesil-acik':'#173827', kirmizi:'#F07B7B', 'kirmizi-acik':'#431D1F', gri:'#B3BDC2', 'gri-acik':'#2A3539', sari:'#E2B44F', 'sari-acik':'#3A2F14' }
};
const KOYU_SORGU = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
const TIK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const D = { grafikGorunum: yerelOku('evb-grafik') || 'grafik', kilitAcikAy: null, sekme: 'ay', ay: null, ayElle: false, raw: null, yil: null, satirlar: [], cek: null, bekleyen: 0, ayarBekleyen: 0, ayar: Object.assign({}, VARS_AYAR), onceki: 'ay' };

/* ---------- Telefonda çalışan yardımcılar (sunucudaki tablo işlemlerinin karşılığı) ---------- */
const DIZI = { Kalemler: 'kalemler', Hareketler: 'hareketler', TutarDegisiklikleri: 'deg' };
let SATIR_SAYAC = 1e7;
function buAy_() { return D.raw.buAy; }
function bugun_() { return D.raw.bugun; }
function bugunGun_() { return D.raw.gun; }
function tz_() { return ''; }
function yeniId_(on) { return (on || '') + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-4); }
function satirYaz_(ad, n) { const a = D.raw[DIZI[ad]]; if (!a) return; if (!n._satir) n._satir = ++SATIR_SAYAC; if (a.indexOf(n) < 0) a.push(n); }
function topluEkle_(ad, l) { l.forEach(n => satirYaz_(ad, n)); }
function satirlariSil_(ad, satirlar) { const a = D.raw[DIZI[ad]]; for (let i = a.length - 1; i >= 0; i--) if (satirlar.indexOf(a[i]._satir) >= 0) a.splice(i, 1); }

/* ---------- Genel yardımcılar ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF0 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
const NF2 = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 2 });
const para = n => (D.ayar.kurus === 'evet' ? NF2 : NF0).format(Math.round((n || 0) * 100) / 100) + (D.ayar.birim === 'hayir' ? '' : ' ₺');
const isaretli = n => (n > 0 ? '+' : n < 0 ? '−' : '') + para(Math.abs(n));
const kisaTarih = t => Number(t.slice(8, 10)) + ' ' + KISA[Number(t.slice(5, 7)) - 1];
const ayAdi = ay => AYLAR[Number(ay.slice(5)) - 1] + ' ' + ay.slice(0, 4);
const girisDegeri = n => n ? String(n).replace('.', ',') : '';
function tutarOku(s) {
  s = String(s || '').replace(/[\s₺]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
function yerelOku(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function yerelYaz(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const kategoriler = () => (D.raw && D.raw.ayarlar && D.raw.ayarlar.kategoriler) || [];

/* Bağlantı: Apps Script adresi ve anahtar bu telefonda saklanır (koda yazılmaz) */
let BAG = yerelOku('evb-baglanti');
let kuyruk = Promise.resolve();
const htmlBaslik = t => { const m = String(t).match(/<title>([^<]*)<\/title>/i); return m ? m[1].trim() : ''; };
function istek(bag, islemAdi, args) {
  const kod = { url: new URL('ortak.js', location.href).href, surum: ORTAK_SURUM };
  return fetch(bag.url, { method: 'POST', body: JSON.stringify({ anahtar: bag.anahtar, islem: islemAdi, args: args, kod: kod }) })
    .then(r => { if (!r.ok) { const h = new Error('Sunucu yanıt vermedi (' + r.status + ').'); h.tur = 'baglanti'; throw h; } return r.text(); },
      e => {
        const yok = navigator.onLine === false;
        const h = new Error(yok ? 'İnternet bağlantısı yok.' : 'Sunucuya ulaşılamadı.');
        h.ag = true; h.tur = yok ? 'internet' : 'baglanti'; h.ayrinti = String(e && e.message || e); throw h;
      })
    .then(t => {
      let j;
      try { j = JSON.parse(t); } catch (e) {
        const b = htmlBaslik(t);
        const h = new Error('Sunucu beklenmeyen bir cevap verdi' + (b ? ' (' + b + ')' : '') + '. Genelde geçicidir.');
        h.tur = 'baglanti'; throw h;
      }
      if (!j.ok) { const h = new Error(j.hata || 'Bilinmeyen hata.'); h.tur = 'islem'; throw h; }
      return j.sonuc;
    });
}
function sunucu(fn, ...args) {
  const p = kuyruk.then(() => istek(BAG, fn.replace(/^api_/, ''), args));
  kuyruk = p.catch(() => {});
  return p;
}
function bildir(m, geriAl) {
  const b = $('bildirim');
  b.innerHTML = `<span>${esc(m)}</span>` + (geriAl ? '<button class="geri-btn">Geri al</button>' : '');
  if (geriAl) b.querySelector('button').onclick = () => { b.hidden = true; geriAl(); };
  b.hidden = false;
  clearTimeout(bildir.t); bildir.t = setTimeout(() => b.hidden = true, geriAl ? 5000 : (m.length > 60 ? 4000 : 2400));
}

/* ---------- Bekleyen kayıtlar (giden kutusu) ----------
   Her değişiklik önce telefonda uygulanır ve buraya not edilir, sonra tabloya gönderilir.
   Uygulama erken kapansa bile bir sonraki açılışta kaldığı yerden gönderilir. */
let GIDEN = yerelOku('evb-giden') || [];
const G = { gonderiliyor: false, deneme: 0, durum: '', baslangic: 0, zaman: null, mesaj: false, sonHata: '' };
const IKON = {
  bulut: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5h.5a3.5 3.5 0 0 1 0 7"/><path d="M12 12v7M9 15l3-3 3 3"/></svg>',
  uyari: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  tamam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const gidenKaydet = () => yerelYaz('evb-giden', GIDEN);
function gonder() {
  if (G.gonderiliyor || !GIDEN.length || !BAG) { durumGoster(); return; }
  G.gonderiliyor = true; G.baslangic = Date.now();
  setTimeout(durumGoster, 3100);
  const paket = GIDEN.slice(0, 25), kimlikler = paket.map(x => x.k);
  sunucu('api_satirKaydet', { toplu: paket.map(x => ({ ad: x.ad, args: x.args })) }).then(p => {
    GIDEN = GIDEN.filter(x => kimlikler.indexOf(x.k) < 0); gidenKaydet();
    G.gonderiliyor = false; G.deneme = 0; G.mesaj = false;
    const sorunluydu = !!G.durum; G.durum = '';
    if (GIDEN.length) { gonder(); return; }
    veriAyarla(p); yerelYaz('evb-veri', p);
    if (!D.cek || D.cek.tip !== 'kalem') ciz();
    durumGoster(sorunluydu ? 'tamam' : '');
  }).catch(e => {
    G.gonderiliyor = false; G.deneme++; G.sonHata = e.message;
    G.durum = e.tur === 'internet' || navigator.onLine === false ? 'internet' : (G.deneme >= 4 ? 'basarisiz' : 'baglanti');
    durumGoster();
    if (!G.mesaj) { G.mesaj = true; bildir(durumMesaji()); }
    clearTimeout(G.zaman);
    G.zaman = setTimeout(gonder, [5, 15, 30, 60, 120][Math.min(G.deneme - 1, 4)] * 1000);
  });
}
window.addEventListener('online', () => { clearTimeout(G.zaman); gonder(); });
function durumMesaji() {
  if (G.durum === 'internet') return 'İnternet yok. Kayıtların telefonda saklanıyor, bağlanınca gönderilecek.';
  if (G.durum === 'basarisiz') return 'Kayıtlar gönderilemedi. Telefonda saklanıyor, bir süre sonra tekrar denenecek.';
  return 'Bağlantı sorunu. Kayıtların telefonda saklanıyor, tekrar deneniyor…';
}
/** Sağ üstteki küçük simge: bulut (gönderim uzun sürdü), turuncu üçgen (sorun var), yeşil tik (sorun çözüldü) */
function durumGoster(ozel) {
  const el = $('senk'); if (!el) return;
  clearTimeout(durumGoster.t);
  if (ozel === 'tamam') { el.className = 'senk tamam'; el.innerHTML = IKON.tamam; el.hidden = false; durumGoster.t = setTimeout(() => durumGoster(), 2200); return; }
  if (G.durum) { el.className = 'senk uyari'; el.innerHTML = IKON.uyari; el.hidden = false; return; }
  if (G.gonderiliyor && Date.now() - G.baslangic > 3000) { el.className = 'senk'; el.innerHTML = IKON.bulut; el.hidden = false; durumGoster.t = setTimeout(durumGoster, 500); return; }
  if (D.yukleniyor && !$('acilis')) { el.className = 'senk yazi'; el.textContent = 'Güncelleniyor…'; el.hidden = false; durumGoster.t = setTimeout(durumGoster, 400); return; }
  el.hidden = true;
}
const senkGoster = () => durumGoster();
function durumAc() {
  if (!G.durum && !GIDEN.length) return;
  D.cek = { tip: 'durum', iptal: false };
  cekmeceAc(`<h3>Bekleyen kayıtlar</h3>
    <p class="aciklama">${esc(G.durum ? durumMesaji() : 'Kayıtlar gönderiliyor.')}</p>
    <div class="bilgi-satirlari">
      <div><span>Bekleyen</span><b>${GIDEN.length} kayıt</b></div>
      ${G.sonHata ? `<div><span>Son hata</span><b style="white-space:normal">${esc(G.sonHata)}</b></div>` : ''}
    </div>
    <button class="btn ana" data-act="simdiGonder">Şimdi tekrar dene</button>
    <button class="btn metin tehlike" data-act="gidenIptal">Bekleyenleri iptal et</button>
    <p class="ipucu" style="text-align:center">İptal edersen bekleyen değişiklikler silinir ve ekran tablodaki hâle döner.</p>`);
}

/* ---------- Kilit (geçmiş aylar) ---------- */
const duzenlenebilir = () => { const d = ayDurumu_(D.ay); return d === 'acik' || (d === 'kilitli' && D.kilitAcikAy === D.ay); };
const kilitParam = () => D.kilitAcikAy === D.ay ? true : undefined;
function kilitUyari() {
  bildir(ayDurumu_(D.ay) === 'arsiv' ? 'Arşivdeki aylar değiştirilemez.' : 'Bu ay kilitli. Düzenlemek için üstteki kilide dokun.');
}
function ayDegistir(ay, elle) { D.ay = ay; D.ayElle = elle; D.kilitAcikAy = null; }
const hamSatir = id => D.raw.hareketler.find(h => String(h.id) === String(id));
/** Bir satırın değişiklikten önceki hâlini saklar; Geri al bu hâle döndürür */
function oncekiHal(s) {
  const h = s.sanal ? null : hamSatir(s.id);
  const tek = !s.kalemId && !s.tip;
  return { ay: s.geciken ? s.ay : D.ay, ad: tek ? s.ad : undefined, tutar: s.tutar, odendi: s.odendi, not: s.not, sonTarih: h ? (h.sonTarih || '') : '',
    kategori: tek ? s.kategori : undefined, kart: tek && s.tur === 'gider' ? !!s.kart : undefined,
    kilitAcik: kilitParam(), gecikenOdeme: s.geciken ? true : undefined };
}
function satiraDon(id, once) {
  const q = temizle({ id: id, ay: once.tasindi ? once.suankiAy : once.ay, yeniAy: once.tasindi ? once.ay : undefined,
    ad: once.ad, tutar: once.tutar, odendi: once.odendi, not: once.not, kategori: once.kategori, kart: once.kart,
    sonTarih: once.gecikenOdeme ? undefined : once.sonTarih, kilitAcik: once.kilitAcik, gecikenOdeme: once.gecikenOdeme });
  if (islem(() => satirKaydet_(D.raw, q), 'api_satirKaydet', q)) bildir('Geri alındı');
}
function hata(e) { bildir((e && e.message) || 'Bir hata oluştu, tekrar deneyin.'); }

/* ---------- Veri ---------- */
function veriAyarla(p) {
  delete p.kod; // eski sürümlerden kalan alan
  if (D.ayarBekleyen && D.raw && D.raw.ayarlar) p.ayarlar = D.raw.ayarlar; // kaydı süren ayar ezilmesin
  D.raw = p; D.raw.sanalHepsi = true;
  if (!D.ay || !D.ayElle) D.ay = p.buAy;
  // Renk, mod, görünüm gibi ayarlar bu cihaza özeldir; tablodan gelen veri bunları değiştirmez.
}
function veriYukle() {
  if (!BAG) return Promise.resolve();

/** Önceki ayların kalanlarının toplamı. Sadece bilgi: kayıt oluşturmaz, gelir sayılmaz. */

  if (ilk >= ay) return '';

  for (let a = ilk, n = 0; a < ay && n < 240; a = ayEkle_(a, 1), n++) devir += ayHesapla_(a, D.raw).ozet.kalan;

function ekleKaydet() {

  const tip = c.tur === 'borc' || c.tur === 'alacak' ? c.tur : '';
  const deger = id => $(id) ? $(id).value : '';
  return {
    id: c.id, tip: tip, tur: tip ? (tip === 'borc' ? 'gider' : 'gelir') : c.tur, ad: $('kAd').value.trim(), tutar: tutarOku($('kTutar').value) || 0,
    kategori: deger('kKat').trim(), toplam: tutarOku(deger('kToplam')) || '', girisTutar: tutarOku(deger('kGiris')) || '', girisAy: deger('kGirisAy'),
    degisken: $('kDegisken').checked,
    aylar: c.belirli && !tip ? c.aylar.slice().sort((a, b) => a - b) : [],
    baslamadi: bm, baslangic: bm ? '' : $('kBas').value, bitis: bm ? '' : $('kBit').value,
    zamAyi: Number(deger('kZam')) || '', odemeGunu: Number(deger('kGun')) || '', not: $('kNot').value.trim()
  };
}
function kalemKaydet() {
  const g = kalemFormOku();
  if (!g.ad) return bildir(g.tip ? 'Kimden/kime olduğunu yaz.' : 'Kalem adı yaz.');
  if (g.tip && !g.baslamadi && !(g.tutar > 0) && !g.degisken) return bildir('Aylık taksiti yaz ya da "Düzenli taksit yok"u işaretle.');
  if (g.girisTutar > 0) g.girisId = yeniId_('h');
  if (D.cek.belirli && !g.tip && !g.aylar.length) return bildir('En az bir ay seç.');
  if (!g.baslamadi && !g.baslangic) return bildir('Başlangıç ayını seç ya da "Henüz başlamadı"yı işaretle.');
  if (g.bitis && g.baslangic && g.bitis < g.baslangic) return bildir('Bitiş, başlangıçtan önce olamaz.');
  if (!g.id) g.yeniId = yeniId_('k');
  cekmeceKapat();
  if (islem(() => kalemKaydet_(D.raw, g), 'api_kalemKaydet', temizle(g))) bildir('Kaydedildi');
}

/* ---------- GRAFİKLER ---------- */
function grafikCiz() {
  const yil = D.yil || +D.ay.slice(0, 4);
  const v = istatistikHesapla_(D.raw, yil);
  const ilk = Math.min(v.ilkYil, yil), son = v.buYil + 1;
  $('ust').innerHTML = `
    <div class="nav">
      <button class="ok" data-act="yil" data-v="-1" ${yil <= ilk ? 'disabled' : ''} aria-label="Önceki yıl">‹</button>
      <span class="ad">${yil} yılı</span>
      <button class="ok" data-act="yil" data-v="1" ${yil >= son ? 'disabled' : ''} aria-label="Sonraki yıl">›</button>
    </div>
    <div class="kalan"><small>Yıl içinde artan</small><strong>${para(v.toplam.fark)}</strong></div>
    <div class="ikili">
      <div><small>Toplam gelir</small><b>${para(v.toplam.gelir)}</b></div>
      <div><small>Toplam gider</small><b>${para(v.toplam.gider)}</b><em>Aylık ortalama ${para(v.toplam.ortalamaGider)}</em></div>
    </div>`;
  const max = Math.max(1, ...v.aylar.map(a => Math.max(a.gelir, a.gider)));
  const sutunlar = v.aylar.map((a, i) => `
    <button class="ay-sutun ${a.gelecek ? 'gelecek' : ''} ${a.ay === D.ay ? 'secili' : ''}" data-act="grafikAy" data-v="${a.ay}" aria-label="${AYLAR[i]}: gelir ${para(a.gelir)}, gider ${para(a.gider)}">
      <div class="cift"><i class="g" style="height:${a.gelir / max * 100}%"></i><i class="x" style="height:${a.gider / max * 100}%"></i></div>
      <span>${KISA[i]}</span></button>`).join('');
  const katT = v.kategoriler.reduce((t, k) => t + k.tutar, 0) || 1;
  const dag = v.kategoriler.length ? v.kategoriler.map(k => `
    <div class="dag"><div class="ust-satir"><span>${esc(k.ad)}</span><b>${para(k.tutar)} <small style="color:var(--soluk);font-weight:500">%${Math.round(k.tutar / katT * 100)}</small></b></div>
    <div class="cubuk"><i style="width:${k.tutar / v.kategoriler[0].tutar * 100}%"></i></div></div>`).join('')
    : '<div class="bos-mesaj">Bu yıl için henüz gider yok.</div>';
  const secim = `<div class="seg" style="margin-top:14px"><button data-act="gGorunum" data-v="grafik" class="${D.grafikGorunum !== 'tablo' ? 'on' : ''}">Grafik</button><button data-act="gGorunum" data-v="tablo" class="${D.grafikGorunum === 'tablo' ? 'on' : ''}">Tablo</button></div>`;
  if (D.grafikGorunum === 'tablo') {
    $('icerik').innerHTML = secim + yillikTabloHTML(yil);
    // Açılınca bu ayın sütunu görünsün
    requestAnimationFrame(() => { const k = document.querySelector('.tablo-kutu'), th = k && k.querySelector('th.bu'); if (th) k.scrollLeft = Math.max(0, th.offsetLeft - 200); });
    return;
  }
  $('icerik').innerHTML = secim + `
    <section class="bolum"><h2>Aylara göre gelir ve gider</h2>
      <div class="kart"><div class="grafik">${sutunlar}</div>
      <div class="lejant"><span><b style="background:var(--yesil)"></b>Gelir</span><span><b style="background:var(--kirmizi)"></b>Gider</span><span>Soluk sütunlar tahmini</span></div></div>
      <p class="ipucu" style="margin-top:8px">Bir aya dokunursan o ayın listesi açılır.</p></section>
    <section class="bolum"><h2>Giderlerin dağılımı<span>${v.yil}</span></h2>
      <div class="kart">${dag}</div>
      <p class="ipucu" style="margin-top:8px">Kartla yapılan harcamalar ayrı sayılmaz, Kredi kartı satırı içinde görünür.</p></section>`;
}

/** Yıllık tablo (E-Tablo'daki özet sayfasının uygulama içi hâli) */
function yillikTabloHTML(yil) {
  const eski = D.raw.sanalHepsi; D.raw.sanalHepsi = true;
  const m = yillikMatris_(D.raw, yil);
  D.raw.sanalHepsi = eski;
  const sayi = n => n === '' || n === undefined || n === 0 ? '' : (n < 0 ? '−' : '') + NF0.format(Math.round(Math.abs(n)));
  const BAS = { gelirBas: 1, giderBas: 1, borcBas: 1 };
  const satirlar = m.satirlar.map(r => {
    if (r.tip === 'bosluk') return '';
    if (BAS[r.tip]) return `<tr class="bas"><td class="ad">${esc(r.ad.replace(/\s*\(.*\)$/, ''))}</td><td colspan="13"></td></tr>`;
    if (r.tip === 'ara') return `<tr class="ara"><td class="ad">${esc(r.ad)}</td><td colspan="13"></td></tr>`;
    const sinif = r.tip === 'toplamGelir' || r.tip === 'toplamGider' ? 'top' : r.tip === 'kalan' ? 'kalan' : '';
    let toplam = 0, var_ = false;
    const hucre = r.hucreler.map((c, i) => {
      if (c.v !== '' && c.durum !== 'tahmin' && r.tip !== 'kart') { toplam += c.v; var_ = true; }
      return `<td class="${c.durum || ''}" data-act="grafikAy" data-v="${m.aylar[i]}">${sayi(c.v)}</td>`;
    }).join('');
    return `<tr class="${sinif}"><td class="ad" title="${esc(r.ad)}">${esc(r.ad)}</td>${hucre}<td class="yil">${var_ ? sayi(toplam) : ''}</td></tr>`;
  }).join('');
  return `<section class="bolum">
    <div class="tablo-kutu"><table class="ytablo">
      <thead><tr><th class="ad">${yil} (₺)</th>${m.aylar.map((a, i) => `<th class="${a === m.bu ? 'bu' : ''}">${KISA[i]}</th>`).join('')}<th>Yıl</th></tr></thead>
      <tbody>${satirlar}</tbody></table></div>
    <div class="lejant"><span><b style="background:var(--yesil)"></b>Ödendi</span><span><b style="background:var(--kirmizi)"></b>Ödenmedi</span><span><b style="background:var(--gri)"></b>Bekliyor</span><span><i>İtalik: tahmini</i></span></div>
    <p class="ipucu" style="margin-top:8px">Tablo yana kayar. Bir hücreye dokunursan o ayın listesi açılır. Yıl sütunu tahminleri saymaz.</p></section>`;
}

    <section class="ayar-kart"><h3>Harcama kategorileri</h3><p class="ipucu">+ ile harcama eklerken çıkan seçenekler. İlk sıradaki varsayılan olarak seçili gelir.</p>

/* ---------- İLK BAĞLANTI ---------- */
function kurulumCiz(hataMesaji, bag, agAyrinti) {
  bag = bag || {};
  $('fab').hidden = true;
  $('ust').innerHTML = baslik('Ev Bütçesi', 'Hoş geldin');
  $('icerik').innerHTML = `<div class="karsilama">
    <h3>Tablona bağlan</h3>
    <p>Google E-Tablo dosyanda üst menüden <b>Bütçe → Bağlantı bilgilerini göster</b>'e tıkla, iki bilgiyi buraya yapıştır. Bu işlem her cihazda bir kez yapılır.</p>
    <p>Uygulama başka bir cihazda açıksa orada <b>Ayarlar → Başka cihaza bağla</b> ile karekodu okutman daha kolay.</p>
    <label class="alan" style="margin-top:12px"><span>Bağlantı adresi (…/exec)</span><input class="giris-kutu" id="bUrl" inputmode="url" autocomplete="off" value="${esc(bag.url || '')}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="alan"><span>Anahtar</span><input class="giris-kutu" id="bAnahtar" autocomplete="off" value="${esc(bag.anahtar || '')}" placeholder="Uzun harf ve rakam dizisi"></label>
    ${hataMesaji ? `<p style="color:var(--kirmizi);font-weight:600;margin-bottom:4px">${esc(hataMesaji)}</p>` : ''}
    ${agAyrinti !== undefined && agAyrinti !== '' ? `<div class="ipucu" style="margin-bottom:10px">Olası sebepler:
      <br>• Tarayıcının reklam/izleyici engelleyicisi (Brave kalkanı) bu siteden Google'a giden isteği engelliyor olabilir.
      <br>• Telefonda Özel DNS ya da reklam engelleyici uygulama açıksa script.googleusercontent.com adresini engelliyor olabilir.
      <br>• Bilgisayarda çalışıyorsa adres ve anahtar doğrudur; sorun bu cihazın bağlantısındadır.
      <br><small>Teknik ayrıntı: ${esc(agAyrinti)}</small></div>` : ''}
    <button class="btn ana" data-act="baglan">Bağlan</button></div>`;
}
/** Kopyalarken bozulan adresleri düzeltir: boşluklar, /u/0/ gibi hesap ekleri, ? ve # sonrası */
function adresDuzelt(u) {
  return String(u || '').replace(/\s+/g, '').replace(/[?#].*$/, '').replace(/\/u\/\d+\//, '/').replace(/\/a\/[^/]+\/macros\//, '/macros/');
}
function baglan(btn, hazir) {
  const bag = hazir || { url: adresDuzelt($('bUrl').value), anahtar: $('bAnahtar').value.replace(/\s+/g, '') };
  if (/\/dev$/.test(bag.url)) return kurulumCiz('Bu test adresi (/dev). Dağıtımları yönet ekranındaki /exec ile biten adresi kullan.', bag);
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(bag.url)) return kurulumCiz('Adres https://script.google.com/macros/s/… ile başlayıp /exec ile bitmeli.', bag);
  if (bag.anahtar.length < 20) return kurulumCiz('Anahtar eksik görünüyor.', bag);
  if (btn) { btn.disabled = true; btn.textContent = 'Bağlanıyor…'; }
  istek(bag, 'veri', []).then(p => {
    BAG = bag; yerelYaz('evb-baglanti', bag);
    D.ayElle = false; veriAyarla(p); yerelYaz('evb-veri', p);
    D.sekme = 'ay'; ciz(); bildir('Bağlandı');
  }).catch(e => kurulumCiz(e.message, bag, e.ag ? e.ayrinti : ''));
}
/* Başka cihaza bağlama bağlantısı: adres + anahtar, sayfa adresinin # kısmında taşınır (sunucuya gitmez) */
const eslesmeLinki = () => location.origin + location.pathname + '#bag=' + btoa(JSON.stringify({ u: BAG.url, a: BAG.anahtar }));
function eslesmeOku() {
  const m = location.hash.match(/^#bag=(.+)$/);
  if (!m) return null;
  history.replaceState(null, '', location.pathname);
  try { const o = JSON.parse(atob(decodeURIComponent(m[1]))); return { url: adresDuzelt(o.u), anahtar: String(o.a || '') }; } catch (e) { return null; }
}
function qrCiz(kutu, metin) {
  const yap = () => { try { const q = qrcode(0, 'M'); q.addData(metin); q.make(); kutu.innerHTML = q.createSvgTag({ cellSize: 5, margin: 3, scalable: true }); } catch (e) { kutu.innerHTML = ''; } };
  if (window.qrcode) return yap();
  const sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  sc.onload = yap; sc.onerror = () => { kutu.innerHTML = '<p class="ipucu">Karekod yüklenemedi, aşağıdaki bağlantıyı kopyalayıp gönder.</p>'; };
  document.head.appendChild(sc);
}

/* ---------- Telefonun geri hareketi ----------
   Pencere açıksa kapatır → başka sekmedeyse Aylık liste'ye döner → başka aydaysa bu aya döner → sonra uygulamadan çıkar */
const anaDurumda = () => !D.cek && (!BAG || D.sekme === 'ay') && (!D.raw || D.ay === D.raw.buAy);
let KORUMA = false;
function geriKontrol() {
  clearTimeout(geriKontrol.t);
  geriKontrol.t = setTimeout(() => { if (!anaDurumda() && !KORUMA) { history.pushState({ evb: 1 }, ''); KORUMA = true; } }, 60);
}
window.addEventListener('popstate', () => {
  KORUMA = false;
  if (D.cek) cekmeceKapat();
  else if (D.sekme !== 'ay') { D.sekme = 'ay'; $('kaydir').scrollTop = 0; ciz(); }
  else if (D.raw && D.ay !== D.raw.buAy) { ayDegistir(D.raw.buAy, false); ciz(); }
  else { history.back(); return; } // ana ekrandayız: uygulamadan çık
  geriKontrol();
});

/* ---------- Çekmece ---------- */
function cekmeceAc(html) {
  $('cekmeceIc').innerHTML = '<div class="cekmece-ust"><div class="tutamak"></div><button class="kapat-btn" data-act="kapat" aria-label="Kapat">✕</button></div>' + html;
  const c = $('cekmece');
  clearTimeout(cekmeceKapat.t); // kapanırken hemen yeniden açılırsa gizlenmesin
  $('perde').hidden = false;
  if (c.hidden) { c.hidden = false; requestAnimationFrame(() => c.classList.add('acik')); } else c.classList.add('acik');
  geriKontrol();
}
function cekmeceKapat() {
  const c = $('cekmece');
  if (document.activeElement) document.activeElement.blur();
  c.classList.remove('acik'); $('perde').hidden = true;
  cekmeceKapat.t = setTimeout(() => { if (!c.classList.contains('acik')) c.hidden = true; }, 230);
  D.cek = null;
  geriKontrol();
}

/* ---------- Olaylar ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  switch (a) {
    case 'sekme': D.sekme = v; D.geriOnay = null; D.bagSil = false; if (D.cek) cekmeceKapat(); $('kaydir').scrollTop = 0; ciz();
      if (v === 'ayar' && BAG) yedekleriYukle(); break;
    case 'baglan': baglan(t); break;
    case 'eslesmeGoster': {
      const k = $('qrKutu'); D.eslesmeAcik = k.hidden; k.hidden = !k.hidden; t.textContent = k.hidden ? 'Karekodu göster' : 'Gizle';
      if (!k.hidden) qrCiz(k, eslesmeLinki()); break;
    }
    case 'eslesmeKopyala': {
      const l = eslesmeLinki();
      (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => bildir('Bağlantı kopyalandı. Kendine gönderip telefonda aç, sonra mesajı sil.'))
        .catch(() => { prompt('Bu bağlantıyı kopyala:', l); });
      break;
    }
    case 'baglantiKaldir':
      if (!D.bagSil) { D.bagSil = true; t.textContent = 'Emin misin? Tekrar dokun'; break; }
      try { localStorage.removeItem('evb-baglanti'); localStorage.removeItem('evb-veri'); } catch (e) {}
      BAG = null; D.raw = null; D.bagSil = false; ciz(); break;
    case 'yedekAl':
      t.disabled = true; t.textContent = 'Yedek alınıyor…';
      sunucu('api_yedekAl').then(l => { D.yedekler = l; bildir('Yedek alındı'); }).catch(hata).then(() => { if (D.sekme === 'ayar') ayarCiz(); });
      break;
    case 'geriYukle':
      if (D.geriOnay !== id) { D.geriOnay = id; $('yedekListe').innerHTML = yedekHTML(); break; }
      if (GIDEN.length) { bildir('Önce bekleyen kayıtların gönderilmesini bekle.'); break; }
      D.geriOnay = null; t.disabled = true; t.textContent = 'Yükleniyor…';
      sunucu('api_yedekGeriYukle', id).then(p => { veriAyarla(p); yerelYaz('evb-veri', p); bildir('Yedek geri yüklendi'); yedekleriYukle(); ciz(); })
        .catch(e => { hata(e); ciz(); });
      break;
    case 'tekrar': $('icerik').innerHTML = '<div class="yukleniyor">Yükleniyor…</div>'; veriYukle(); break;
    case 'onceki': case 'sonraki': ayDegistir(ayEkle_(D.ay, a === 'onceki' ? -1 : 1), true); ciz(); break;
    case 'buay': ayDegistir(D.raw.buAy, false); ciz(); break;
    case 'kilitAc':
      D.cek = { tip: 'kilit' };
      cekmeceAc(`<h3>${ayAdi(D.ay)} kilitli</h3>
        <p class="aciklama">Geçmiş ayları değiştirmek raporlarını ve grafikleri etkiler. Sadece düzeltme yapacaksan aç. Başka aya geçtiğinde kilit kendiliğinden kapanır.</p>
        <button class="btn ana" data-act="kilitOnay">Düzenlemeyi aç</button>
        <button class="btn metin" data-act="kapat">Vazgeç</button>`);
      break;
    case 'kilitOnay': D.kilitAcikAy = D.ay; cekmeceKapat(); ciz(); bildir('Düzenleme açık'); break;
    case 'kilitKapat': D.kilitAcikAy = null; ciz(); break;
    case 'tik': tikla(id, t.dataset.ay || undefined); break;
    case 'duzenle': satirAc(id, t.dataset.ay || undefined); break;
    case 'gecikenTumu': D.gecikenAcik = !D.gecikenAcik; ciz(); break;
    case 'eBagli': { const k = ekleKoru(); D.cek.bagli = v; ekleCiz(k); break; }
    case 'eAlt': { const k = ekleKoru(); D.cek.alt = v; ekleCiz(k); break; }
    case 'eSekil': { const k = ekleKoru(); D.cek.sekil = v; ekleCiz(k); break; }
    case 'kapat': cekmeceKapat(); break;
    case 'satirKaydet': satirKaydet(t.dataset.odendi); break;
    case 'atla': case 'geriAl': {
      const s = satirBul(D.cek.id, D.cek.gAy); cekmeceKapat(); if (!s) break;
      const once = oncekiHal(s);
      const p = satirParam(s, a === 'atla' ? { atla: true } : { geriAl: true });
      if (islem(() => satirKaydet_(D.raw, p), 'api_satirKaydet', p))
        bildir(a === 'atla' ? s.ad + ': bu ay yok' : s.ad + ' geri getirildi', () => satiraDon(p.yeniId || s.id, once));
      break;
    }
    case 'borcSil': case 'borcKapat': {
      if (!D.cek.onay) { D.cek.onay = a; t.textContent = 'Emin misin? Tekrar dokun'; break; }
      if (D.cek.onay !== a) { D.cek.onay = a; t.textContent = 'Emin misin? Tekrar dokun'; break; }
      const s = satirBul(D.cek.id, D.cek.gAy); cekmeceKapat(); if (!s) break;
      const kid = s.bagli, ka = kilitParam(), ad = s.ad;
      if (a === 'borcSil') { if (islem(() => borcSil_(D.raw, kid, ka), 'api_borcSil', kid, ka)) bildir(ad + ' silindi'); }
      else if (islem(() => kalemSonlandir_(D.raw, kid), 'api_kalemSonlandir', kid)) bildir(ad + ' kapatıldı. Sabitler → Kapananlar bölümünden yeniden açabilirsin.');
      break;
    }
    case 'kapananAc': D.kapananAcik = !D.kapananAcik; ciz(); break;
    case 'gGorunum': D.grafikGorunum = v; yerelYaz('evb-grafik', v); ciz(); break;
    case 'kapananDetay': {
      const k = D.raw.kalemler.find(x => String(x.id) === id); if (!k) break;
      D.cek = { tip: 'kapanan', id };
      cekmeceAc(`<h3>${esc(k.ad)}</h3>
        <p class="aciklama">${k.tip === 'borc' ? 'Borç' : 'Alacak'}, kapatıldı</p>
        <div class="bilgi-satirlari">
          <div><span>${k.tip === 'borc' ? 'Ödenen' : 'Alınan'}</span><b>${para(borcOdenen_(k, D.raw))}</b></div>
          ${num_(k.toplam) ? `<div><span>Toplam</span><b>${para(num_(k.toplam))}</b></div>` : ''}
          ${k.not ? `<div><span>Açıklama</span><b>${esc(k.not)}</b></div>` : ''}
        </div>
        <button class="btn ikinci" data-act="yenidenAc" data-id="${esc(id)}">Yeniden aç</button>`);
      break;
    }
    case 'yenidenAc': cekmeceKapat(); if (islem(() => kalemYenidenAc_(D.raw, id), 'api_kalemYenidenAc', id)) bildir('Yeniden açıldı'); break;
    case 'sil': {
      const s = satirBul(D.cek.id, D.cek.gAy); cekmeceKapat(); if (!s) break;
      const kopya = Object.assign({}, hamSatir(s.id)), ka = kilitParam();
      if (islem(() => satirSil_(D.raw, s.id, ka), 'api_satirSil', s.id, ka))
        bildir(s.ad + ' silindi', () => { if (islem(() => satirGeriEkle_(D.raw, kopya, ka), 'api_satirGeriEkle', kopya, ka)) bildir('Geri alındı'); });
      break;
    }
    case 'ekle': if (D.sekme === 'sabit') kalemAc(); else if (duzenlenebilir()) ekleAc(); else kilitUyari(); break;
    case 'eTur': { const k = ekleKoru(); D.cek.tur = v; D.cek.kat = null; ekleCiz(k); break; }
    case 'eKat': { const k = ekleKoru(); D.cek.kat = v; ekleCiz(k); break; }
    case 'ekleKaydet': ekleKaydet(); break;
    case 'kalemAc': kalemAc(id); break;
    case 'kTur': { const g = kalemFormOku(); D.cek.tur = v; g.tip = v === 'borc' || v === 'alacak' ? v : ''; kalemCiz(g); break; }
    case 'kSiklik': { const g = kalemFormOku(); D.cek.belirli = v === '1'; kalemCiz(Object.assign(g, { aylar: D.cek.aylar })); break; }
    case 'kAy': { const n = +v, i = D.cek.aylar.indexOf(n); if (i >= 0) D.cek.aylar.splice(i, 1); else D.cek.aylar.push(n); t.classList.toggle('on'); break; }
    case 'kalemKaydet': kalemKaydet(); break;
    case 'kalemSonlandir':
      if (!D.cek.sil) { D.cek.sil = true; t.textContent = 'Emin misin? Tekrar dokun'; break; }
      { const kid = D.cek.id; cekmeceKapat(); if (islem(() => kalemSonlandir_(D.raw, kid), 'api_kalemSonlandir', kid)) bildir('Kalem sonlandırıldı'); }
      break;
    case 'tasi': {
      // Yeni sırayı telefonda hesapla, tablona tam sırayı gönder
      const kopya = JSON.parse(JSON.stringify(D.raw)), asil = D.raw;
      D.raw = kopya; kalemTasi_(D.raw, id, +v); const sira = D.raw.kalemler.filter(k => bool_(k.aktif)).sort((a, b) => num_(a.sira) - num_(b.sira)).map(k => String(k.id)); D.raw = asil;
      islem(() => kalemTasi_(D.raw, id, +v, sira), 'api_kalemTasi', id, +v, sira); break;
    }
    case 'yil': D.yil = (D.yil || +D.ay.slice(0, 4)) + (+v); ciz(); break;
    case 'grafikAy': D.sekme = 'ay'; ayDegistir(v, true); $('kaydir').scrollTop = 0; ciz(); break;
    case 'ayar': ayarKaydet(t.dataset.k, v); break;
    case 'katSil': {
      const l = kategoriler(), ad = l[+v];
      const say = D.raw.hareketler.filter(h => !h.tip && h.kategori === ad).length + D.raw.kalemler.filter(k => !k.tip && k.kategori === ad).length;
      if (!say) { ayarKaydet('kategoriler', l.filter((_, i) => i !== +v)); break; }
      const digerleri = l.filter(x => x !== ad);
      if (!digerleri.length) { bildir('Önce başka bir kategori ekle, kayıtlar oraya taşınacak.'); break; }
      D.cek = { tip: 'katTasi', eski: ad, say: say, hedef: digerleri.includes('Diğer') ? 'Diğer' : digerleri[0] };
      katTasiCiz(); break;
    }
    case 'katHedef': D.cek.hedef = v; katTasiCiz(); break;
    case 'katTasiOnay': {
      const eski = D.cek.eski, hedef = D.cek.hedef; cekmeceKapat();
      if (islem(() => kategoriTasi_(D.raw, eski, hedef), 'api_kategoriTasi', eski, hedef)) {
        ayarKaydet('kategoriler', kategoriler().filter(x => x !== eski));
        bildir(`${eski} silindi, kayıtları ${hedef} kategorisine taşındı.`);
      }
      break;
    }
    case 'durum': durumAc(); break;
    case 'simdiGonder': cekmeceKapat(); G.deneme = 0; clearTimeout(G.zaman); gonder(); break;
    case 'gidenIptal':
      if (!D.cek.iptal) { D.cek.iptal = true; t.textContent = 'Emin misin? Tekrar dokun'; break; }
      cekmeceKapat(); GIDEN = []; gidenKaydet(); G.durum = ''; G.deneme = 0; clearTimeout(G.zaman); durumGoster(); veriYukle();
      bildir('Bekleyen kayıtlar iptal edildi.'); break;
    case 'sKat': D.cek.kat = v; document.querySelectorAll('#sKatlar .cip').forEach(c => c.classList.toggle('on', c.dataset.v === v)); break;
    case 'katEkle': {
      const yeni = $('yeniKat').value.replace(/,/g, ' ').trim();
      if (!yeni) break;
      if (kategoriler().some(k => k.toLocaleLowerCase('tr') === yeni.toLocaleLowerCase('tr'))) { bildir('Bu kategori zaten var.'); break; }
      ayarKaydet('kategoriler', kategoriler().concat([yeni])); break;
    }
  }
});
document.addEventListener('input', e => { if (['eTutar', 'eTaksit', 'eKart', 'eTaksitT', 'eSayi', 'eIlkAy'].includes(e.target.id)) ekleIpucu(); });
document.addEventListener('change', e => {
  if (['eTaksit', 'eKart'].includes(e.target.id)) ekleIpucu();
  if (e.target.id === 'kBaslamadi') $('kBas').disabled = e.target.checked;
  if (e.target.hasAttribute('data-ayar-kurus')) ayarKaydet('kurus', e.target.checked ? 'evet' : 'hayir');
  if (e.target.hasAttribute('data-ayar-birim')) ayarKaydet('birim', e.target.checked ? 'evet' : 'hayir');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'yeniKat') { e.preventDefault(); document.querySelector('[data-act=katEkle]').click(); }
  if (e.key === 'Enter' && D.cek) {
    if (D.cek.tip === 'ekle' && e.target.id !== 'eTaksit') { e.preventDefault(); ekleKaydet(); }
    if (D.cek.tip === 'satir') { e.preventDefault(); const s = satirBul(D.cek.id, D.cek.gAy); satirKaydet(s && !s.odendi && !s.kart ? '1' : undefined); }
  }
  if (e.key === 'Escape' && D.cek) cekmeceKapat();
});

/* ---------- Başlangıç: önce telefondaki son kopyayı göster, sonra tabloyla eşitle ---------- */
ayarUygula(yerelOku('evb-ayar') || {});
const ACILIS_T0 = Date.now();
function acilisKapat() {
  const a = $('acilis'); if (!a || a.classList.contains('kapan')) return;
  setTimeout(() => { a.classList.add('kapan'); setTimeout(() => a.remove(), 320); }, Math.max(0, 1000 - (Date.now() - ACILIS_T0)));
}
setTimeout(acilisKapat, 2000);
if (KOYU_SORGU && KOYU_SORGU.addEventListener) KOYU_SORGU.addEventListener('change', () => ayarUygula({}));
(function () {
  const eslesme = eslesmeOku();
  if (eslesme) { acilisKapat(); ciz(); baglan(null, eslesme); return; }
  if (!BAG) acilisKapat();
  const kopya = BAG && yerelOku('evb-veri');
  if (kopya && kopya.kalemler) { try { veriAyarla(kopya); ciz(); } catch (e) { console.warn(e); } }
  else ciz();
  if (ORTAK_SURUM !== '3.6') bildir('Güncelleme yükleniyor. Birkaç dakika sonra uygulamayı kapatıp yeniden aç.');
  if (GIDEN.length) gonder(); // önceki oturumdan kalan kayıtlar
  veriYukle().then(acilisKapat, acilisKapat);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
